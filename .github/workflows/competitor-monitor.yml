name: Competitor official-site monitor

on:
  workflow_dispatch:
  schedule:
    # Two UTC slots keep the run at 08:00 Europe/Kyiv across daylight-saving changes.
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"

permissions:
  contents: read

concurrency:
  group: competitor-official-site-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check official competitor websites
        run: node scripts/competitor-monitor.mjs --scheduled
      - name: Store the daily official-site report
        uses: actions/upload-artifact@v4
        with:
          name: competitor-monitor-${{ github.run_id }}
          path: public/dashboard/data/competitor-monitor.json
          retention-days: 31
